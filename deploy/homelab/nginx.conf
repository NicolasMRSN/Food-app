map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  # API Supabase servies sur la même origine que l'app (auth, REST, temps réel, Edge Functions)
  location ~ ^/(auth|rest|realtime|functions|graphql)/v1/ {
    proxy_pass http://api-gw:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 8443;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA : toutes les routes renvoient vers index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
